<svg xmlns="http://www.w3.org/2000/svg" width="620" height="110" viewBox="0 0 620 110" role="img" aria-label="TryHackMe stats card — rsudhanshu.in.in">
  <!-- card bg — github dark + matrix border -->
  <rect x="1.5" y="1.5" width="617" height="107" rx="12" fill="#0d1117" stroke="#9acc14" stroke-width="1.5"/>

  <!-- left: logo tile -->
  <rect x="18" y="29" width="52" height="52" rx="10" fill="#0b1f12" stroke="#9acc14" stroke-width="1.5"/>
  <text x="44" y="63" font-family="Courier New, monospace" font-size="22" font-weight="bold" fill="#9acc14" text-anchor="middle">&gt;_</text>

  <!-- left: identity -->
  <text x="86" y="44" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="#ffffff" letter-spacing="1">TRYHACKME</text>
  <text x="86" y="66" font-family="Courier New, monospace" font-size="14" fill="#8b949e">@rsudhanshu.in.in</text>
  <text x="86" y="90" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="#c792ea">[0x9][MAGE] · STUDENT</text>

  <!-- live pulse dot -->
  <circle cx="248" cy="20" r="4" fill="#00ff41">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- divider -->
  <line x1="266" y1="16" x2="266" y2="94" stroke="#21262d" stroke-width="1.5"/>

  <!-- stats: 4 columns -->
  <text x="318" y="46" font-family="Courier New, monospace" font-size="11" fill="#8b949e" text-anchor="middle" letter-spacing="1">STREAK</text>
  <text x="318" y="74" font-family="Courier New, monospace" font-size="21" font-weight="bold" fill="#ff6633" text-anchor="middle">376d</text>

  <text x="400" y="44" font-family="Courier New, monospace" font-size="11" fill="#8b949e" letter-spacing="1">ROOMS</text>
  <text x="400" y="74" font-family="Courier New, monospace" font-size="21" font-weight="bold" fill="#00e5ff" text-anchor="middle">91</text>

  <text x="484" y="44" font-family="Courier New, monospace" font-size="11" fill="#8b949e" letter-spacing="1">RANK</text>
  <text x="484" y="74" font-family="Courier New, monospace" font-size="19" font-weight="bold" fill="#9acc14" text-anchor="middle">top 5%</text>
  <text x="484" y="90" font-family="Courier New, monospace" font-size="10" fill="#8b949e" text-anchor="middle">#136928</text>

  <text x="566" y="44" font-family="Courier New, monospace" font-size="11" fill="#8b949e" letter-spacing="1">BADGES</text>
  <text x="566" y="74" font-family="Courier New, monospace" font-size="21" font-weight="bold" fill="#ffd60a" text-anchor="middle">18</text>

  <!-- bottom hairline accent -->
  <line x1="18" y1="97" x2="130" y2="97" stroke="#9acc14" stroke-width="2" opacity="0.35"/>
</svg>
